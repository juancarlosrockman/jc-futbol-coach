{% extends "layout.html" %}{% block content %}<a class="back" href="{{url_for('home')}}">← Volver</a><div class="card"><h2>Lista de espera</h2><p class="muted">Si no encuentras un horario, déjanos tus datos para coordinar.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Padre/madre</label><input name="parent_name" value="{{prefill.get('parent_name', '')}}" required><label>WhatsApp</label><input name="whatsapp" value="{{prefill.get('whatsapp', '')}}" required><label>Alumno</label><input name="student_name" value="{{prefill.get('student_name', '')}}" required><label>Edad</label><input name="age" type="number" min="3" value="{{prefill.get('age', '')}}" required><label>Zona</label><input name="zone" value="{{prefill.get('zone', '')}}" required><label>Preferencia de horario</label><textarea name="preferences" placeholder="Días, horas o cualquier detalle"></textarea><button class="btn green">Unirme a la lista</button></form></div>{% endblock %}
