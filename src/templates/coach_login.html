{% extends "layout.html" %}{% block content %}
<div class="card auth-card"><img class="hero-logo" src="{{url_for('static',filename='logo.jpg')}}" alt="JC Fútbol Coach"><h1>Acceso Coach</h1><p class="muted">Ingresa con tus credenciales de entrenador.</p><form method="post" onsubmit="if(this.dataset.submitted==='1')return false;this.dataset.submitted='1';const b=this.querySelector('button[type=submit]');if(b){b.disabled=true;b.textContent='Ingresando…';}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Usuario</label><input name="user" autocomplete="username" required><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required><button class="btn green">Ingresar</button></form><a class="back" href="{{url_for('home')}}">← Volver al inicio</a></div>
{% endblock %}
