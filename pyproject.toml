[project]
name = "jc-futbol-coach"
version = "1.0.1"
description = "JC Futbol Coach web app running on Cloudflare Python Workers"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "workers-py==1.17.7",
    "workers-runtime-sdk",
]
