# Cloudflare deployment configuration
[project]
name = "jc-futbol-coach"
version = "1.0.0"
description = "JC Fútbol Coach web app running on Cloudflare Python Workers"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "psycopg>=3.2,<4",
    "requests>=2.32,<3",
    "cryptography>=42.0,<46",
    "workers-py>=1.9",
]

[dependency-groups]
dev = [
    "workers-runtime-sdk",
]
