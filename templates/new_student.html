{% extends "layout.html" %}
{% block content %}
<header><h2>➕ Registrar alumno</h2></header>
<main>
<a href="{{url_for('students')}}" class="back">← Alumnos</a>
<div class="notice">Los alumnos actuales los registras tú manualmente. Aquí puedes asignar la tarifa que corresponda a cada caso.</div>
<form method="post">
<label>Padre/madre</label><input name="parent_name" required>
<label>WhatsApp</label><input name="parent_whatsapp" required>
<label>Alumno</label><input name="student_name" required>
<label>DNI del alumno</label><input name="dni" required>
<label>Edad</label><input name="age" type="number" min="3" required>
<label>Zona</label><select name="zone"><option>San Borja</option><option>Surco / Chacarilla</option><option>Barranco</option></select>
<label>Modalidad</label><select name="mode"><option>Parque</option><option>Domicilio</option></select>
<label>Parque o dirección</label><input name="place" required>
<label>Tarifa por sesión (S/)</label><input name="tariff" type="number" min="0" step="0.01" required>
<label>Fotos y videos</label><select name="photo_consent"><option>Sí, autorizo</option><option>No, no autorizo</option></select>
<button class="green">Guardar alumno</button>
</form>
</main>
{% endblock %}
