{% extends "layout.html" %}{% block content %}<header><h2>💰 Control de pagos</h2><div class="muted">Resumen mensual</div></header><main><a href="{{url_for('dashboard')}}" class="back">← Panel</a><div class="card"><h2>Pagado registrado</h2><div style="font-size:28px;font-weight:800;color:#087b3f">S/ {{'%.2f'|format(paid)}}</div></div><div class="card"><h2>Registrar pago</h2><form method="post"><label>Alumno</label><select name="student_id">{% for s in students %}<option value="{{s.id}}">{{s.student_name}}</option>{% endfor %}</select><label>Mes</label><input name="month" value="2026-09"><label>Monto</label><input name="amount" type="number" step="0.01" required><label>Medio</label><select name="method"><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Efectivo</option></select><label>Nota</label><input name="note"><button class="green">✓ Registrar pago</button></form></div><div class="card"><h2>Historial</h2>{% for p in payments %}<div class="row"><span><b>{{p.student_name}}</b><br>{{p.month}} · {{p.method}}</span><span class="pill">S/ {{'%.0f'|format(p.amount)}}</span></div>{% endfor %}</div></main>{% endblock %}
