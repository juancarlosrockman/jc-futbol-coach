{% extends "layout.html" %}{% block content %}<a class="back" href="{{url_for('home')}}">← Volver</a><div class="card"><h2>Servicios</h2><p class="muted">Cuéntame qué necesitas y coordinamos contigo los detalles y el monto.</p><form method="post"><label>Servicio</label><select name="service">{% for s in services %}<option>{{s}}</option>{% endfor %}</select><label>Nombre del equipo / celebración / evento</label><input name="name" required><label>Persona de contacto</label><input name="contact" required><label>WhatsApp</label><input name="whatsapp" required><label>Número de participantes</label><input name="players" type="number" min="1" value="1" required><label>Lugar</label><input name="place" placeholder="Zona, parque o dirección" required><div class="grid"><div><label>Fecha</label><input name="date" type="date" required></div><div><label>Hora</label><input name="time" type="time" required></div></div><label>Detalles adicionales</label><textarea name="notes" placeholder="Cuéntame lo que necesitas"></textarea><div class="notice">El monto se coordina posteriormente con Coach Juan Carlos. No necesitas ingresarlo aquí.</div><button class="btn green">Enviar solicitud</button></form></div>{% endblock %}
