{% extends "layout.html" %}{% block content %}
<a class="back" href="{{url_for('dashboard')}}">← Panel</a>
<div class="card"><h1>Agendar clases</h1><p class="muted">Coach Juan Carlos puede agendar una o varias fechas reales. Puedes programar más clases de las cubiertas por el pago; esas quedarán como <b>pendientes de pago</b>.</p>
<form method="post" id="classForm">
<label>Alumno</label><select name="student_id" id="student_id" required>{% for s in students %}<option value="{{s.id}}" data-zone="{{s.zone or ''}}" data-place="{{s.place or ''}}" {% if selected and selected.id==s.id %}selected{% endif %}>{{s.student_name}} — S/{{s.tariff|int}} por clase</option>{% endfor %}</select>
<div id="groups"></div><button type="button" class="btn light" onclick="addGroup()">+ Agregar otro horario</button>
<hr><h3>💰 Pago mensual (opcional)</h3><label>¿Pago recibido?</label><select name="payment_received" id="payment_received" onchange="togglePay()"><option value="no">No, pagará después</option><option value="yes">Sí, ya pagó</option></select>
<div id="paybox" style="display:none"><label>Tipo de pago</label><select name="payment_type" id="payment_type" onchange="togglePayType()"><option value="regular">Pago mensual</option><option value="package_8">Paquete especial de 8 clases — S/520</option></select><div id="regularAmount"><label>Monto recibido (S/)</label><input name="payment_amount" id="payment_amount" type="number" step="0.01" value="70"></div><label>Mes / período</label><input name="payment_month" type="month"><label>Medio de pago</label><select name="payment_method"><option>Yape</option><option>Plin</option><option>Efectivo</option><option>Otro</option></select><label>Nota</label><input name="payment_note"></div>
<button class="btn green" style="margin-top:15px">💾 Registrar clases</button></form></div>
<script>
let n=0;const days={{days|tojson}};
function addGroup(){const i=n++;const d=document.createElement('div');d.className='card schedule-group';d.innerHTML=`<h4>Horario ${i+1}</h4><label>Día</label><select class="gd">${days.map(x=>`<option>${x}</option>`).join('')}</select><label>Primera fecha real</label><input type="date" class="gs" required><label>Hora</label><input type="time" class="gt" required><label>Cantidad de clases</label><input type="number" class="gc" min="1" max="52" value="1" required><p class="small muted">Zona, modalidad y lugar se toman de los datos del alumno.</p><label>Observación</label><input class="gn"><button type="button" class="btn light" onclick="this.closest('.schedule-group').remove()">Eliminar este horario</button>`;document.getElementById('groups').appendChild(d)}

function di(x){return days.indexOf(x)}function fd(d){return d.toISOString().slice(0,10)}
document.getElementById('classForm').addEventListener('submit',e=>{document.querySelectorAll('.gen').forEach(x=>x.remove());let k=0,ok=true;document.querySelectorAll('.schedule-group').forEach(g=>{const wd=g.querySelector('.gd').value,sv=g.querySelector('.gs').value,t=g.querySelector('.gt').value,c=parseInt(g.querySelector('.gc').value||0);if(!sv||!t||!c)return;const st=new Date(sv+'T12:00:00');if(st.getDay()!==((di(wd)+1)%7)){alert('La primera fecha debe corresponder al día seleccionado: '+wd+'.');ok=false;return}for(let j=0;j<c;j++){const x=new Date(st);x.setDate(x.getDate()+j*7);const vals={date:fd(x),time:t,notes:g.querySelector('.gn').value.trim()};for(const [key,val] of Object.entries(vals)){const q=document.createElement('input');q.type='hidden';q.name=`class_${key}_${k}`;q.value=val;q.className='gen';e.target.appendChild(q)}k++}});if(!ok)e.preventDefault()});addGroup();
function togglePay(){document.getElementById('paybox').style.display=document.getElementById('payment_received').value==='yes'?'block':'none'}function updateRegularAmount(){const o=document.querySelector('#student_id option:checked');const m=(o?.textContent.match(/S\/(\d+(?:\.\d+)?)/)||[])[1];const tariff=parseFloat(m||0);if(document.getElementById('payment_type').value==='regular'&&tariff>0){const a=document.getElementById('payment_amount');if(!a.dataset.edited)a.value=tariff.toFixed(2)}}
function togglePayType(){document.getElementById('regularAmount').style.display=document.getElementById('payment_type').value==='regular'?'block':'none';if(document.getElementById('payment_type').value==='package_8')document.getElementById('payment_amount').value=520;else updateRegularAmount()}
document.getElementById('payment_amount').addEventListener('input',e=>e.target.dataset.edited='1');document.getElementById('groups').addEventListener('input',updateRegularAmount);document.getElementById('student_id').addEventListener('change',()=>{document.getElementById('payment_amount').dataset.edited='';updateRegularAmount()});
</script>{% endblock %}
