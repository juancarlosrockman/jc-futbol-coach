{% extends "layout.html" %}{% block content %}<header><h2>📅 Registrar clases</h2></header><main><a href="{{url_for('dashboard')}}" class="back">← Panel</a><div class="card"><h2>Programar una o varias clases</h2><form method="post" id="classForm"><label>Alumno</label><select name="student_id" id="student_id" required>{% for s in students %}<option value="{{s.id}}" data-zone="{{s.zone or ''}}" data-mode="{{s.mode or 'Parque'}}" data-place="{{s.place or ''}}" {% if selected and selected.id==s.id %}selected{% endif %}>{{s.student_name}}</option>{% endfor %}</select><div id="groups"></div><button type="button" class="light" onclick="addGroup()">+ Agregar otro horario</button><div class="notice">Las clases se guardan con fechas reales. Puedes generar varias semanas y combinar grupos.</div><button class="green" type="submit">💾 Registrar clases</button></form></div><script>
let n=0;const days={{days|tojson}};function addGroup(){const i=n++;const d=document.createElement('div');d.className='card schedule-group';d.innerHTML=`<h4>Horario ${i+1}</h4><label>Día</label><select class="gd">${days.map(x=>`<option>${x}</option>`).join('')}</select><label>Primera fecha real</label><input type="date" class="gs" required><label>Hora</label><input type="time" class="gt" required><label>Cantidad de clases</label><input type="number" class="gc" min="1" max="52" value="1" required><label>Zona</label><input class="gz" list="zonas" placeholder="Zona del alumno"><datalist id="zonas">{% for z in zones %}<option value="{{z}}">{% endfor %}</datalist><label>Modalidad</label><select class="gm"><option>Parque</option><option>Domicilio</option></select><label>Parque o dirección</label><input class="gp"><label>Observación</label><input class="gn"><button type="button" class="light" onclick="this.closest('.schedule-group').remove()">Eliminar este grupo</button>`;document.getElementById('groups').appendChild(d);defaults()}function defaults(){let o=document.querySelector('#student_id option:checked');if(!o)return;document.querySelectorAll('.schedule-group').forEach(g=>{if(!g.querySelector('.gz').value)g.querySelector('.gz').value=o.dataset.zone||'';if(!g.querySelector('.gp').value)g.querySelector('.gp').value=o.dataset.place||''})}function di(x){return days.indexOf(x)}function fd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}document.getElementById('classForm').addEventListener('submit',e=>{document.querySelectorAll('.gen').forEach(x=>x.remove());let k=0,ok=true;if(!document.getElementById('student_id').value){alert('Selecciona un alumno.');e.preventDefault();return}document.querySelectorAll('.schedule-group').forEach(g=>{let wd=g.querySelector('.gd').value,sv=g.querySelector('.gs').value,t=g.querySelector('.gt').value,c=parseInt(g.querySelector('.gc').value||0);if(!sv||!t||!c)return;let st=new Date(sv+'T12:00:00');if(st.getDay()!=((di(wd)+1)%7)){alert('La primera fecha debe corresponder al día seleccionado: '+wd+'.');ok=false;return}for(let j=0;j<c;j++){let x=new Date(st);x.setDate(x.getDate()+j*7);let vals={date:fd(x),time:t,zone:g.querySelector('.gz').value.trim(),mode:g.querySelector('.gm').value,place:g.querySelector('.gp').value.trim(),notes:g.querySelector('.gn').value.trim()};for(let [key,val] of Object.entries(vals)){let q=document.createElement('input');q.type='hidden';q.name=`class_${key}_${k}`;q.value=val;q.className='gen';e.target.appendChild(q)}k++}});if(!ok)e.preventDefault()});addGroup();</script></main>{% endblock %}
