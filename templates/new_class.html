{% extends "layout.html" %}{% block content %}<a class="back" href="{{url_for('dashboard')}}">← Panel</a><div class="card"><h1>Registrar clases</h1><p class="muted">Programa una o varias clases con fechas reales y, si corresponde, registra el pago en el mismo paso.</p><form method="post" id="classForm"><label>Alumno</label><select name="student_id" id="student_id" required>{% for s in students %}<option value="{{s.id}}" data-zone="{{s.zone or ''}}" data-place="{{s.place or ''}}" {% if selected and selected.id==s.id %}selected{% endif %}>{{s.student_name}} — S/{{s.tariff|int}} por clase</option>{% endfor %}</select><div id="groups"></div><button type="button" class="btn light" onclick="addGroup()">+ Agregar otro horario</button><hr><h3>💰 Pago (opcional)</h3><label>¿Pago recibido?</label><select name="payment_received" id="payment_received" onchange="togglePay()"><option value="no">No, pagará después</option><option value="yes">Sí, ya pagó</option></select><div id="paybox" style="display:none"><label>Tipo de pago</label><select name="payment_type" id="payment_type" onchange="togglePayType()"><option value="regular">Pago regular</option><option value="package_8">Nuevo paquete de 8 clases — S/520</option><option value="package_existing">Usar un paquete ya pagado</option></select><div id="regularAmount"><label>Monto recibido (S/)</label><input name="payment_amount" id="payment_amount" type="number" step="0.01" value="70"></div><div id="existingPackage" style="display:none"><label>Paquete disponible</label><select name="package_id"><option value="">Selecciona un paquete</option>{% for p in packages %}<option value="{{p.id}}">{{p.month}} · S/520</option>{% endfor %}</select></div><label>Mes / período</label><input name="payment_month" type="month"><label>Medio de pago</label><select name="payment_method"><option>Yape</option><option>Plin</option><option>Efectivo</option><option>Otro</option></select><label>Nota</label><input name="payment_note"></div><button class="btn green" style="margin-top:15px">💾 Registrar clases</button></form></div><script>
let n=0;const days={{days|tojson}};const zones={{zones|tojson}};function addGroup(){const i=n++;const d=document.createElement('div');d.className='card schedule-group';d.innerHTML=`<h4>Horario ${i+1}</h4><label>Día</label><select class="gd">${days.map(x=>`<option>${x}</option>`).join('')}</select><label>Primera fecha real</label><input type="date" class="gs" required><label>Hora</label><input type="time" class="gt" required><label>Cantidad de clases</label><input type="number" class="gc" min="1" max="52" value="1" required><label>Zona</label><input class="gz" list="zones-${i}" placeholder="Ej. Chorrillos" required><datalist id="zones-${i}">${zones.map(x=>`<option>${x}</option>`).join('')}</datalist><label>Modalidad</label><select class="gm"><option>Parque</option><option>Domicilio</option></select><label>Parque o dirección</label><input class="gp" required><label>Observación</label><input class="gn"><button type="button" class="btn light" onclick="this.closest('.schedule-group').remove()">Eliminar este horario</button>`;document.getElementById('groups').appendChild(d);defaults()}
function defaults(){const o=document.querySelector('#student_id option:checked');document.querySelectorAll('.schedule-group').forEach(g=>{if(!g.querySelector('.gz').value)g.querySelector('.gz').value=o?.dataset.zone||'';if(!g.querySelector('.gp').value)g.querySelector('.gp').value=o?.dataset.place||''})}document.getElementById('student_id').addEventListener('change',defaults);function di(x){return days.indexOf(x)}function fd(d){return d.toISOString().slice(0,10)}document.getElementById('classForm').addEventListener('submit',e=>{document.querySelectorAll('.gen').forEach(x=>x.remove());let k=0,ok=true;document.querySelectorAll('.schedule-group').forEach(g=>{const wd=g.querySelector('.gd').value,sv=g.querySelector('.gs').value,t=g.querySelector('.gt').value,c=parseInt(g.querySelector('.gc').value||0);if(!sv||!t||!c)return;const st=new Date(sv+'T12:00:00');if(st.getDay()!==((di(wd)+1)%7)){alert('La primera fecha debe corresponder al día seleccionado: '+wd+'.');ok=false;return}for(let j=0;j<c;j++){const x=new Date(st);x.setDate(x.getDate()+j*7);const vals={date:fd(x),time:t,zone:g.querySelector('.gz').value.trim(),mode:g.querySelector('.gm').value,place:g.querySelector('.gp').value.trim(),notes:g.querySelector('.gn').value.trim()};for(const [key,val] of Object.entries(vals)){const q=document.createElement('input');q.type='hidden';q.name=`class_${key}_${k}`;q.value=val;q.className='gen';e.target.appendChild(q)}k++}});if(!ok)e.preventDefault()});addGroup();function togglePay(){document.getElementById('paybox').style.display=document.getElementById('payment_received').value==='yes'?'block':'none'}function togglePayType(){const v=document.getElementById('payment_type').value;document.getElementById('regularAmount').style.display=v==='regular'?'block':'none';document.getElementById('existingPackage').style.display=v==='package_existing'?'block':'none';if(v==='package_8')document.getElementById('payment_amount').value=520}</script>{% endblock %}
