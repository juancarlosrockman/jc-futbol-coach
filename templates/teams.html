{% extends "layout.html" %}{% block content %}<header><h2>🏆 Equipos / eventos</h2></header><main><a href="{{url_for('dashboard')}}" class="back">← Panel</a><div class="card"><form method="post"><label>Nombre del equipo</label><input name="name" required><label>Responsable</label><input name="contact" required><label>WhatsApp</label><input name="whatsapp" required><label>Jugadores</label><input name="players" type="number" required><label>Servicio</label><select name="service"><option>Entrenamiento</option><option>Dirección de partido</option><option>Entrenamiento + dirección de partido</option></select><label>Lugar</label><input name="place" required><label>Fecha</label><input name="date" type="date" required><label>Hora</label><input name="time" type="time" required><label>Monto</label><input name="amount" type="number" step="0.01"><label>Pago</label><select name="payment_status"><option value="pending">Pendiente</option><option value="paid">Pagado</option><option value="partial">Pago parcial</option></select><label>Observaciones</label><textarea name="notes"></textarea><button class="green">Guardar servicio</button></form></div><div class="card"><h2>Servicios registrados</h2>{% for t in teams %}<div class="row"><span><b>{{t.name}}</b><br>{{t.players}} jugadores · {{t.service}}<br><span class="muted">{{t.date}} · {{t.time}} · {{t.place}}</span></span><span class="pill">{{t.payment_status}}</span></div>{% endfor %}</div></main>{% endblock %}
