{% extends "layout.html" %}{% block content %}<header><h2>🕐 Disponibilidad</h2></header><main><a href="{{url_for('dashboard')}}" class="back">← Panel</a><div class="card">{% for a in availability %}<div class="row"><span>{{a.zone}} · {{a.day}}</span><b>{{a.time}}</b></div>{% endfor %}</div><div class="card"><h2>Agregar horario</h2><form method="post"><label>Zona</label><input name="zone" required><label>Día</label><select name="day"><option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option></select><label>Hora</label><input name="time" type="time" required><button class="green">+ Agregar disponibilidad</button></form></div></main>{% endblock %}
