{% extends "layout.html" %}{% block content %}
<header><img class="logo" src="{{url_for('static',filename='logo.webp')}}"><h2>🔐 Cambiar contraseña</h2></header>
<main>
{% with msgs=get_flashed_messages() %}{% for m in msgs %}<div class="notice">{{m}}</div>{% endfor %}{% endwith %}
<form method="post">
<label>Contraseña actual</label><input name="current_password" type="password" required autocomplete="current-password">
<label>Nueva contraseña</label><input name="new_password" type="password" minlength="6" required autocomplete="new-password">
<label>Confirmar nueva contraseña</label><input name="confirm_password" type="password" minlength="6" required autocomplete="new-password">
<button class="green">Guardar nueva contraseña</button>
</form>
<a href="{{url_for('parent_home')}}"><button class="light">Volver</button></a>
</main>{% endblock %}
