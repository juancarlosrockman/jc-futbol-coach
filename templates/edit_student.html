{% extends "layout.html" %}{% block content %}<a class="back" href="{{url_for('student_detail',sid=s.id)}}">← Ficha</a><div class="card"><h1>Editar alumno</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid"><div><label>Padre/madre</label><input name="parent_name" value="{{s.parent_name}}" required><label>WhatsApp</label><input name="parent_whatsapp" value="{{s.parent_whatsapp}}" required><label>Alumno</label><input name="student_name" value="{{s.student_name}}" required><label>DNI / documento</label><input name="dni" value="{{s.dni or ''}}" required><label>Edad</label><input name="age" type="number" min="3" value="{{s.age}}" required></div><div><label>Zona</label><input name="zone" value="{{s.zone or ''}}" required><label>Modalidad</label><select name="mode"><option {% if s.mode=='Parque' %}selected{% endif %}>Parque</option><option {% if s.mode=='Domicilio' %}selected{% endif %}>Domicilio</option></select><label>Parque o dirección</label><input name="place" value="{{s.place or ''}}" required><label>Tarifa habitual por clase (S/)</label><input name="tariff" type="number" step="0.01" value="{{s.tariff}}" required><label>Tarifa si rompe el paquete (S/)</label><input name="break_tariff" type="number" step="0.01" min="0" value="{{s.break_tariff if s.break_tariff is not none else (60 if s.age|int >= 6 and (s.tariff|float - 55)|abs < 0.01 else s.tariff)}}" required><p class="small muted">Si toma menos de 8 clases en el período, se cobra esta tarifa por clase.</p><label>Fotos y videos</label><select name="photo_consent"><option {% if s.photo_consent=='No, no autorizo' %}selected{% endif %}>No, no autorizo</option><option {% if s.photo_consent=='Sí, autorizo' %}selected{% endif %}>Sí, autorizo</option></select></div></div><button class="btn green">Guardar cambios</button></form></div>{% endblock %}
