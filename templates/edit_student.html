{% extends "layout.html" %}{% block content %}<header><h2>✏️ Editar alumno</h2></header><main><a href="{{url_for('student_detail',sid=s.id)}}" class="back">← Ficha</a><div class="notice">Actualiza el DNI para habilitar el acceso con WhatsApp + DNI.</div><form method="post"><label>Nombre del padre/madre</label><input name="parent_name" value="{{s.parent_name}}" required><label>WhatsApp del padre/madre</label><input name="parent_whatsapp" value="{{s.parent_whatsapp}}" inputmode="numeric" required><label>Nombre del alumno</label><input name="student_name" value="{{s.student_name}}" required><label>DNI (contraseña inicial)</label><input name="dni" value="{{s.dni or ''}}" inputmode="numeric" required><label>Edad</label><input name="age" type="number" min="3" max="99" value="{{s.age}}" required><label>Zona</label><input name="zone" value="{{s.zone or ''}}"><label>Modalidad</label><select name="mode"><option {% if s.mode=='Parque' %}selected{% endif %}>Parque</option><option {% if s.mode=='Domicilio' %}selected{% endif %}>Domicilio</option></select><label>Lugar</label><input name="place" value="{{s.place or ''}}" required><label>Tarifa</label><input name="tariff" type="number" min="0" step="1" value="{{'%.0f'|format(s.tariff)}}" required><label>Fotos y videos</label><select name="photo_consent"><option {% if s.photo_consent=='No' %}selected{% endif %}>No</option><option {% if s.photo_consent=='Sí' %}selected{% endif %}>Sí</option></select><button class="green">Guardar cambios</button></form></main>{% endblock %}
